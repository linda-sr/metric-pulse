name: dbt CI Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "metricpulse_dbt/**"
      - "data_pipeline/**"
      - "data_generator/**"

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    services:
      postgres_oltp:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: oltp_user
          POSTGRES_PASSWORD: oltp_password
          POSTGRES_DB: saas_oltp
        ports:
          - 5431:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo_telemetry:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo_user
          MONGO_INITDB_ROOT_PASSWORD: mongo_password
        ports:
          - 27017:27017

      postgres_warehouse_ci:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_warehouse
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: pip install -r data_generator/requirements.txt

      - name: Generate synthetic OLTP data
        working-directory: data_generator
        run: python generate_oltp.py

      - name: Generate synthetic clickstream data
        working-directory: data_generator
        run: python generate_clickstream.py

      - name: Install pipeline dependencies
        run: pip install -r data_pipeline/requirements.txt

      - name: Run ELT pipeline into CI warehouse
        working-directory: data_pipeline
        env:
          TARGET: ci
          CI_WAREHOUSE_URL: postgresql://ci_user:ci_password@localhost:5434/ci_warehouse
        run: python run_pipeline.py --stage full

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Install dbt packages
        working-directory: metricpulse_dbt
        run: dbt deps

      - name: dbt run (CI warehouse)
        working-directory: metricpulse_dbt
        env:
          DBT_HOST: localhost
          DBT_PORT: 5434
          DBT_USER: ci_user
          DBT_PASSWORD: ci_password
          DBT_DBNAME: ci_warehouse
        run: dbt run --target cloud --profiles-dir ./profiles

      - name: dbt test (CI warehouse)
        working-directory: metricpulse_dbt
        env:
          DBT_HOST: localhost
          DBT_PORT: 5434
          DBT_USER: ci_user
          DBT_PASSWORD: ci_password
          DBT_DBNAME: ci_warehouse
        run: dbt test --target cloud --profiles-dir ./profiles