version: "3.9"

services:
  postgres_oltp:
    image: postgres:15-alpine
    container_name: postgres_oltp
    restart: unless-stopped
    environment:
      POSTGRES_USER: oltp_user
      POSTGRES_PASSWORD: oltp_password
      POSTGRES_DB: saas_oltp
    ports:
      - "5431:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data

  mongo_telemetry:
    image: mongo:latest
    container_name: metricpulse_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: metricpulse_telemetry
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres_warehouse:
    image: postgres:15-alpine
    container_name: postgres_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: saas_warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data

volumes:
  oltp_data:
  mongo_data:
  warehouse_data: